output: dist/

releases:
  # Job de Android (solo universal) — corre en ubuntu
  - name: android
    jobs:
      - name: release-android-universal
        package:
          platform: android
          target: apk
          build_args:
            flavor: production
        publish_to: github

  # Job de Windows — corre en windows
  - name: windows
    jobs:
      - name: release-windows-exe
        package:
          platform: windows
          target: exe
        publish_to: github

  # Job de Linux — corre en ubuntu
  - name: linux
    jobs:
      - name: release-linux-appimage
        package:
          platform: linux
          target: appimage
        publish_to: github