name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:

  # ─── Android ────────────────────────────────────────────────
  release-android:
    runs-on: ubuntu-latest
    env:
      PLATFORM_PREFIX: "Android"
    steps:
      - name: Eliminar assets existentes del release
        run: |
          # Obtener el ID del release para el tag actual
          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('id',''))")
          
          if [ -z "$RELEASE_ID" ]; then
            echo "No existe release para este tag aún, continuando."
            exit 0
          fi

          echo "Release ID: $RELEASE_ID"

          # Obtener lista de assets y eliminar los de esta plataforma
          curl -s \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            | python3 -c "
          import sys, json
          assets = json.load(sys.stdin)
          for a in assets:
              print(a['id'], a['name'])
          " | while read ASSET_ID ASSET_NAME; do
            if [[ "$ASSET_NAME" == *"$PLATFORM_PREFIX"* ]]; then
              echo "Eliminando asset: $ASSET_NAME (ID: $ASSET_ID)"
              curl -s -X DELETE \
                -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            fi
          done
        env:
          PLATFORM_PREFIX: ${{ matrix.platform_prefix }}

      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Flutter Setup
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable

      - name: Decode Keystore
        run: echo $ENCODED_STRING | base64 -di > ./android/app/release.jks
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEYSTORE }}

      - name: Generar key.properties
        run: |
          cd android
          echo storePassword=${{ secrets.KEYSTORE_PASSWORD }} >> key.properties
          echo keyPassword=${{ secrets.KEY_PASSWORD }} >> key.properties
          echo keyAlias=${{ secrets.KEY_ALIAS }} >> key.properties
          echo storeFile=release.jks >> key.properties
          cd -

      - name: Instalar fastforge
        run: dart pub global activate fastforge

      - name: Agregar fastforge al PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: flutter pub get
        run: flutter pub get

      # Universal via fastforge
      - name: Build y Release APK universal
        run: fastforge release --name android
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # APKs por arquitectura directamente con flutter
      - name: Build APKs por arquitectura
        run: flutter build apk --split-per-abi --flavor production
        env:
          RELEASE_STOREPASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEYPASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Renombrar APKs
        run: |
          mkdir -p release
          mv build/app/outputs/flutter-apk/app-arm64-v8a-production-release.apk release/Android-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-production-release.apk release/Android-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-production-release.apk release/Android-x86-64.apk

      # Subir los splits con nombres explícitos
      - name: Release APKs por arquitectura
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            release/Android-arm64-v8a.apk
            release/Android-armeabi-v7a.apk
            release/Android-x86-64.apk

  # ─── Windows ────────────────────────────────────────────────
  release-windows:
    runs-on: windows-latest
    env:
      PLATFORM_PREFIX: "Windows"
    steps:
      - name: Eliminar assets existentes del release
        run: |
          $releaseResponse = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" `
            -Headers @{ Authorization = "token $env:RELEASE_TOKEN"; Accept = "application/vnd.github.v3+json" } `
            -ErrorAction SilentlyContinue

          if (-not $releaseResponse -or -not $releaseResponse.id) {
            Write-Host "No existe release para este tag aún, continuando."
            exit 0
          }

          $releaseId = $releaseResponse.id
          Write-Host "Release ID: $releaseId"

          $assets = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets" `
            -Headers @{ Authorization = "token $env:RELEASE_TOKEN"; Accept = "application/vnd.github.v3+json" }

          foreach ($asset in $assets) {
            if ($asset.name -like "*Windows*") {
              Write-Host "Eliminando: $($asset.name)"
              Invoke-RestMethod -Method Delete `
                -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" `
                -Headers @{ Authorization = "token $env:RELEASE_TOKEN"; Accept = "application/vnd.github.v3+json" }
            }
          }
        shell: pwsh
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Flutter Setup
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          
      - name: Instalar Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Instalar fastforge
        run: dart pub global activate fastforge

      - name: Agregar fastforge al PATH
        run: echo "$env:USERPROFILE\AppData\Local\Pub\Cache\bin" | Out-File -FilePath
          $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: flutter pub get
        run: flutter pub get

      - name: Build y Release Windows
        run: fastforge release --name windows
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

  # ─── Linux ──────────────────────────────────────────────────
  release-linux:
    runs-on: ubuntu-latest
    env:
      PLATFORM_PREFIX: "Linux"
    steps:
      - name: Eliminar assets existentes del release
        run: |
          # Obtener el ID del release para el tag actual
          RELEASE_ID=$(curl -s \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | python3 -c "import sys,json; data=json.load(sys.stdin); print(data.get('id',''))")
          
          if [ -z "$RELEASE_ID" ]; then
            echo "No existe release para este tag aún, continuando."
            exit 0
          fi

          echo "Release ID: $RELEASE_ID"

          # Obtener lista de assets y eliminar los de esta plataforma
          curl -s \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            | python3 -c "
          import sys, json
          assets = json.load(sys.stdin)
          for a in assets:
              print(a['id'], a['name'])
          " | while read ASSET_ID ASSET_NAME; do
            if [[ "$ASSET_NAME" == *"$PLATFORM_PREFIX"* ]]; then
              echo "Eliminando asset: $ASSET_NAME (ID: $ASSET_ID)"
              curl -s -X DELETE \
                -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            fi
          done
        env:
          PLATFORM_PREFIX: ${{ matrix.platform_prefix }}
          
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Flutter Setup
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable

      - name: Instalar dependencias de sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev appstream \
            fuse libfuse2
          # AppImageTool necesita FUSE para construir el AppImage
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          sudo chown root:$USER /dev/fuse

      - name: Instalar fastforge
        run: dart pub global activate fastforge

      - name: Agregar fastforge al PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: flutter pub get
        run: flutter pub get

      - name: Install appimagetool
        run: |
          wget -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Build y Release Linux
        run: fastforge release --name linux
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

  # ─── Publicar el body del release ───────────────────────────
  update-release-body:
    runs-on: ubuntu-latest
    needs: [ release-android, release-windows, release-linux ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Actualizar descripción del release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          body_path: .github/release_body.md
